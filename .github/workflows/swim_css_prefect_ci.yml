name: IRONMAN CSS Prefect canary - offline safeguards
on:
  pull_request:
    branches:
      - feat/mcp-test-training-plan-lab
    paths:
      - scripts/ironman_jobs/swim_css*.py
      - prefect/ironman-swim-css-audit-v1.yaml
      - tests/test_swim_css_prefect_canary.py
      - .github/workflows/swim_css_prefect_ci.yml
permissions:
  contents: read
concurrency:
  group: swim-css-prefect-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  canary-offline:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Prefect test runtime
        run: python -m pip install 'prefect==3.8.8' 'pytest==9.0.2'
      - name: Exercise manifest, revision, permissions and negative-QA path
        env:
          PYTHONPATH: .:src
        run: |
          python -m pytest -q tests/test_swim_css_prefect_canary.py
          python -c 'from scripts.ironman_jobs.swim_css_prefect_flow import swim_css_flow; assert swim_css_flow.name == "ironman-swim-css-audit-v1"'
          printf 'SWIM_CSS_PREFECT_GUARDS_PASS\n'
