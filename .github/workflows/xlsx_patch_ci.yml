name: IRONMAN XLSX patch offline tests
on:
  push:
    paths:
      - 'scripts/ironman_jobs/ironman_xlsx_patch.py'
      - 'tests/test_ironman_xlsx_patch.py'
      - '.github/workflows/xlsx_patch_ci.yml'
  pull_request:
    paths:
      - 'scripts/ironman_jobs/ironman_xlsx_patch.py'
      - 'tests/test_ironman_xlsx_patch.py'
      - '.github/workflows/xlsx_patch_ci.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl pytest
      - run: python -m pytest -q tests/test_ironman_xlsx_patch.py
