name: IRONMAN reliable writer unit checks

on:
  pull_request:
    branches:
      - feat/mcp-test-training-plan-lab
    paths:
      - scripts/ironman_jobs/plan_patch_batch_core.py
      - tests/test_plan_patch_batch_core.py
      - scripts/ironman_jobs/tp_plan_readonly_gateway.py
      - scripts/ironman_jobs/plan_patch_reader_live_smoke_20261018.py
      - tests/test_tp_plan_readonly_gateway.py
      - data/ironman_operator_jobs.json
      - docs/IRONMAN_RELIABLE_PLAN_PATCH_ENGINE_V1.md
      - .github/workflows/plan_patch_engine_ci.yml

permissions:
  contents: read

jobs:
  plan-patch-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runtime
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify offline patch engine (no provider calls)
        run: python -m pytest -q tests/test_plan_patch_batch_core.py tests/test_tp_plan_readonly_gateway.py
      - name: Verify direct-run imports as used on DigitalOcean
        run: |
          cd scripts/ironman_jobs
          PYTHONPATH=../../src python -c "import plan_patch_batch_core, tp_plan_readonly_gateway"
