name: IRONMAN Prefect 3 Isolated LAB

on:
  pull_request:
    branches:
      - feat/mcp-test-training-plan-lab
    paths:
      - ".github/workflows/ironman-prefect3-isolated-lab.yml"
      - "scripts/ironman_jobs/prefect3_isolated_resume_pilot_20261015.py"
      - "tests/test_prefect3_isolated_resume_pilot_20261015.py"
      - "scripts/ironman_jobs/prefect3_worker_resume_flow_20261015.py"
      - "scripts/ironman_jobs/prefect3_worker_lifecycle_canary_20261015.py"
      - "tests/test_prefect3_worker_restart_lab_20261015.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-prefect:
    name: Prefect 3 / readback + crash recovery / no provider access
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref == 'lab/ironman-prefect-20261015'
    timeout-minutes: 18
    env:
      IRONMAN_ISOLATED_PREFECT_LAB: "1"
      PREFECT_LOGGING_LEVEL: "WARNING"
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_CLOUD_ENABLE_ORCHESTRATION_TELEMETRY: "false"
    steps:
      - name: Checkout source, no credentials for external providers
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate Prefect local state
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/ironman-prefect-lab"
          echo "PREFECT_HOME=$RUNNER_TEMP/ironman-prefect-lab" >> "$GITHUB_ENV"

      - name: Install upstream Prefect and test runner only
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "prefect==3.8.8" "pytest>=8,<10"

      - name: Test actual Prefect execution and isolated recovery
        shell: bash
        run: |
          python -m pytest -q tests/test_prefect3_isolated_resume_pilot_20261015.py tests/test_prefect3_worker_restart_lab_20261015.py

      - name: Exercise real Prefect server + process worker queue after worker and server restart
        shell: bash
        timeout-minutes: 10
        run: |
          set -eu
          python scripts/ironman_jobs/prefect3_worker_lifecycle_canary_20261015.py
