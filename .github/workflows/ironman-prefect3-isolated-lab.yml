      - "scripts/ironman_jobs/install_coaching_radar_staging_20261016.sh"
      - "scripts/ironman_jobs/verify_coaching_radar_staging_20261016.py"
      - "prefect/ironman-coaching-radar-v1.yaml"
      - "tests/test_coaching_radar_prefect_v2.py"
      - "tests/test_coaching_radar_v2_staging_transition.py"
      - "tests/test_coaching_radar_detached_deploy.py"
      - "scripts/ironman_jobs/deploy_coaching_radar_v2_detached_20261017.sh"
      - "scripts/ironman_jobs/install_coaching_radar_v2_staging_20261017.sh"
      - "scripts/ironman_jobs/verify_coaching_radar_v2_pilot_staging_20261017.py"
      - "scripts/ironman_jobs/install_coaching_radar_group_staging_20261017.sh"
      - "scripts/ironman_jobs/verify_coaching_radar_group_staging_20261017.py"
      - "prefect/ironman-coaching-radar-v2.yaml"
      - "scripts/ironman_jobs/coaching_radar_prefect_v2.py"
      - "data/coaching_radar_alberto_group_v1.json"
      - "scripts/ironman_jobs/coaching_radar_kb_context_v0.py"
      - "tests/test_coaching_radar_kb_context_v0.py"
      - "scripts/ironman_jobs/coaching_radar_drive_context_adapter_v0.py"
      - "tests/test_coaching_radar_drive_context_adapter_v0.py"
      - "tests/test_coaching_radar_ai_context_contract_v0.py"
      - "tests/test_coaching_radar_ai_review_benchmark_v1.py"
      - "tests/test_materialize_coaching_radar_ai_provider_payloads_v1.py"
      - "scripts/ironman_jobs/materialize_coaching_radar_ai_provider_payloads_v1.py"
      - "data/coaching_radar_ai_provider_candidates_v1.json"
      - "data/coaching_radar_ai_provider_review_schema_v1.json"
      - "tests/test_coaching_radar_ai_provider_payload_v1.py"
      - "scripts/ironman_jobs/coaching_radar_ai_provider_payload_v1.py"
      - "tests/test_materialize_coaching_radar_ai_private_benchmark_v1.py"
      - "scripts/ironman_jobs/materialize_coaching_radar_ai_private_benchmark_v1.py"
      - "data/coaching_radar_ai_review_benchmark_v1.json"
      - "scripts/ironman_jobs/score_coaching_radar_ai_review_v1.py"
      - "scripts/ironman_jobs/build_coaching_radar_ai_review_benchmark_v1.py"
      - "scripts/ironman_jobs/coaching_radar_ai_context_live_canary_20261017.py"
      - "tests/test_validate_coaching_radar_ai_context_eval_cases_v1.py"
      - "scripts/ironman_jobs/validate_coaching_radar_ai_context_eval_cases_v1.py"
      - "data/coaching_radar_ai_context_eval_cases_v1.json"
      - "tests/test_coaching_radar_ai_context_compiler_v0.py"
      - "scripts/ironman_jobs/coaching_radar_ai_context_compiler_v0.py"
      - "scripts/ironman_jobs/coaching_radar_ai_context_contract_v0.py"
      - "scripts/ironman_jobs/radar_drive_runtime_preflight_20261017.py"
      - "tests/test_radar_drive_runtime_preflight_20261017.py"
      - "scripts/ironman_jobs/validate_radar_drive_credentials_20261017.py"
      - "tests/test_validate_radar_drive_credentials_20261017.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-prefect:
    name: Prefect 3 / readback + crash recovery / no provider access
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref == 'lab/ironman-prefect-20261015'
    timeout-minutes: 18
    env:
      IRONMAN_ISOLATED_PREFECT_LAB: "1"
      PREFECT_LOGGING_LEVEL: "WARNING"
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_CLOUD_ENABLE_ORCHESTRATION_TELEMETRY: "false"
    steps:
      - name: Checkout source, no credentials for external providers
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate Prefect local state
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/ironman-prefect-lab"
          echo "PREFECT_HOME=$RUNNER_TEMP/ironman-prefect-lab" >> "$GITHUB_ENV"

      - name: Install upstream Prefect and test runner only
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "prefect==3.8.8" "pytest>=8,<10"

      - name: Test actual Prefect execution and isolated recovery
        shell: bash
        run: |
          python -m pytest -q tests/test_prefect3_isolated_resume_pilot_20261015.py tests/test_prefect3_worker_restart_lab_20261015.py tests/test_coaching_radar_polverari_v0.py tests/test_coaching_radar_prefect_v1.py tests/test_coaching_radar_staging_deploy.py tests/test_prefect_admin_pull_agent.py tests/test_coaching_radar_prefect_v2.py tests/test_coaching_radar_v2_staging_transition.py tests/test_coaching_radar_detached_deploy.py tests/test_coaching_radar_kb_context_v0.py tests/test_coaching_radar_drive_context_adapter_v0.py tests/test_radar_drive_runtime_preflight_20261017.py tests/test_validate_radar_drive_credentials_20261017.py tests/test_coaching_radar_ai_context_contract_v0.py tests/test_coaching_radar_ai_context_compiler_v0.py tests/test_validate_coaching_radar_ai_context_eval_cases_v1.py tests/test_coaching_radar_ai_review_benchmark_v1.py tests/test_materialize_coaching_radar_ai_private_benchmark_v1.py tests/test_coaching_radar_ai_provider_payload_v1.py tests/test_materialize_coaching_radar_ai_provider_payloads_v1.py

      - name: Exercise real Prefect server + process worker queue after worker and server restart
        shell: bash
        timeout-minutes: 10
        run: |
          set -eu
          python scripts/ironman_jobs/prefect3_worker_lifecycle_canary_20261015.py
