prefect-version: "3.8.8"
name: ironman-coaching-radar-v2
build: []
push: []
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: "/opt/ironman-prefect/radar-src"
deployments:
  - name: polverari-readonly-daily-v2
    version: "v2-readonly-pilot-daily"
    tags:
      - ironman
      - coaching-radar
      - readonly
      - pilot
      - daily-triage
    description: "IRONMAN Coaching Radar V2 retained single-athlete fallback; scheduled daily run disabled after multi-athlete bridge canary PASS."
    entrypoint: "scripts/ironman_jobs/coaching_radar_prefect_v2.py:coaching_radar_group_flow"
    parameters:
      athlete_ids:
        - 2932097
      lookback_days: 3
      lookahead_days: 3
      bridge_base: "http://10.114.0.2:8787"
      output_dir: "/var/lib/ironman-prefect/radar-pilot-v2"
    schedules:
      - cron: "30 5 * * *"
        timezone: "Europe/Rome"
        active: false
    work_pool:
      name: "ironman-prefect-staging-process"
      work_queue_name: null
      job_variables: {}

  - name: alberto-group-readonly-daily
    version: "v2-readonly-multiathlete"
    tags:
      - ironman
      - coaching-radar
      - readonly
      - multi-athlete
      - daily-triage
    description: "IRONMAN Coaching Radar V2 daily read-only triage for active Alberto group roster. Live bridge allowlist canary PASS 10/10; daily schedule active."
    entrypoint: "scripts/ironman_jobs/coaching_radar_prefect_v2.py:coaching_radar_group_flow"
    parameters:
      lookback_days: 3
      lookahead_days: 3
      bridge_base: "http://10.114.0.2:8787"
      output_dir: "/var/lib/ironman-prefect/radar"
    schedules:
      - cron: "30 5 * * *"
        timezone: "Europe/Rome"
        active: true
    work_pool:
      name: "ironman-prefect-staging-process"
      work_queue_name: null
      job_variables: {}
