prefect-version: "3.8.8"
name: ironman-coaching-radar-v1
build: []
push: []
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: "/opt/ironman-prefect/radar-src"
deployments:
  - name: polverari-readonly-pilot
    version: "v1-readonly"
    tags:
      - ironman
      - coaching-radar
      - readonly
      - pilot
    description: "IRONMAN Coaching Radar V1 read-only pilot for athlete 2932097."
    entrypoint: "scripts/ironman_jobs/coaching_radar_prefect_v1.py:coaching_radar_flow"
    parameters:
      athlete_id: 2932097
      lookback_days: 3
      lookahead_days: 3
      bridge_base: "http://10.114.0.2:8787"
      output_dir: "/var/lib/ironman-prefect/radar"
    work_pool:
      name: "ironman-prefect-staging-process"
      work_queue_name: null
      job_variables: {}
